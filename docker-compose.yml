services:
  backend:
    build:
      context: ./backend
    container_name: novacrest-backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      MAX_QUERY_LENGTH: ${MAX_QUERY_LENGTH:-500}
      MAX_K: ${MAX_K:-10}
      MAX_MAX_TOKENS: ${MAX_MAX_TOKENS:-1024}
    ports:
      - "7860:7860"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: novacrest-frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:7860}
      BACKEND_API_KEY: ${API_AUTH_TOKEN:-}
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
